name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Réentraînement du modèle (nouvelles données)
        run: python train.py

      - name: Exécution des tests (Pytest) et Quality Gate
        run: pytest -v tests/

      - name: Résumé visible dans GitHub
        if: always()
        run: |
          echo "## Résultat du pipeline MLOps" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Modèle réentraîné sur les données du dépôt" >> $GITHUB_STEP_SUMMARY
          echo "- Tests et Quality Gate exécutés" >> $GITHUB_STEP_SUMMARY

      - name: Sauvegarde du modèle et des métriques
        uses: actions/upload-artifact@v4
        with:
          name: modele-et-mlruns
          path: |
            models/
            mlruns/
          if-no-files-found: ignore